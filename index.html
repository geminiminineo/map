<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Интерактивная карта квеста</title>
</head>
<body style="margin:0; padding:0;">
    <div style="position: relative; width: 100%; max-width: 800px; margin: 0 auto;">
        <img src="https://okt-cdo.ru/sveden/files/af7d3380f79902b6c16f54a586341c2a.png" 
             alt="Карта квеста" 
             style="width: 100%; height: auto; display: block;">
        
        <a href="https://okt-cdo.ru/sveden/common" 
           style="position: absolute; bottom: 11%; left: 69%; width: 40px; height: 40px; 
                  cursor: pointer; background: border-radius: 100%; 
                  transition: transform 0.2s; display: block;"></a>
        
        <a href="#link2" 
           style="position: absolute; bottom: 45%; left: 62%; width: 40px; height: 40px; 
                  cursor: pointer; background: border-radius: 50%; 
                  transition: transform 0.2s; display: block;"></a>
        
        <a href="#link3" 
           style="position: absolute; bottom: 64%; left: 30%; width: 40px; height: 40px; 
                  cursor: pointer; background: border-radius: 50%; 
                  transition: transform 0.2s; display: block;"></a>
        
        <a href="#link4" 
           style="position: absolute; top: 3%; left: 43%; width: 40px; height: 40px; 
                  cursor: pointer; background: border-radius: 50%; 
                  transition: transform 0.2s; display: block;"></a>
    </div>

    <script>
        document.querySelectorAll('a').forEach(link => {
            link.onmouseover = function() { this.style.transform = 'scale(1.1)'; }
            link.onmouseout = function() { this.style.transform = 'scale(1)'; }
        });
    </script>
</body>
</html>
